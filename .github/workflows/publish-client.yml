name: Publish Angular client (reusable)

# Called once per service, independently of (and in parallel with) that
# service's own deploy job — see deploy.yml. Nothing here is hand-written
# or committed:
#
#   1. boot the service locally with `wrangler dev` (real workerd runtime,
#      D1/R2/queues/DOs simulated locally — no live deployment involved)
#      and pull its OpenAPI spec straight off `GET /openapi.json`
#   2. feed that spec to openapi-generator-cli's `typescript-angular`
#      generator, which produces a full ng-packagr-buildable Angular
#      library (services, models, an injection token for the base URL, ...)
#   3. build it with ng-packagr
#   4. publish it to GitHub Packages under a dist-tag matching the
#      environment, so the separate Angular frontend installs
#      `@thenewestera/<service>-ng@dev` / `@staging` / `latest` per
#      environment
#
# Output lives in clients/<service>/ (gitignored) purely as scratch space
# for this job — see the root .gitignore.

on:
  workflow_call:
    inputs:
      service:
        description: "Service name, used for the output dir and logs (e.g. 'accounts')."
        required: true
        type: string
      working_directory:
        description: "Path to the app's wrangler.jsonc, e.g. 'apps/accounts'."
        required: true
        type: string
      package_name:
        description: "Published npm package name, e.g. '@thenewestera/accounts-ng'."
        required: true
        type: string
      environment:
        description: "dev | staging | production — picks the --env flag for `wrangler dev`, and the dist-tag (dev/staging/latest) + version scheme."
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      NPM_PUBLISH_TOKEN:
        description: "Token with write:packages against this repo's GitHub Packages registry. Falls back to the run's GITHUB_TOKEN when not provided."
        required: false

env:
  NODE_VERSION: "22"
  NG_VERSION: "20.0.0"
  GH_PACKAGES_SCOPE: "@thenewestera"
  DEV_PORT: "8787"

jobs:
  publish:
    name: publish-client (${{ inputs.service }} / ${{ inputs.environment }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: ${{ env.GH_PACKAGES_SCOPE }}

      - run: npm ci

      - id: envflag
        run: |
          if [ "${{ inputs.environment }}" = "dev" ]; then
            echo 'flag=--env=""' >> "$GITHUB_OUTPUT"
          else
            echo "flag=--env ${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          fi

      # Real workerd runtime, entirely local — D1/R2/queues/Durable Objects
      # are simulated in-process, so this needs no live deployment and
      # doesn't touch/depend on any environment's actually-deployed Worker.
      - name: Boot service locally and fetch its OpenAPI spec
        working-directory: ${{ inputs.working_directory }}
        run: |
          npx wrangler dev ${{ steps.envflag.outputs.flag }} --port "$DEV_PORT" > wrangler-dev.log 2>&1 &
          echo $! > dev.pid

          ok=""
          for i in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:$DEV_PORT/openapi.json" -o "$GITHUB_WORKSPACE/spec.json"; then
              ok=1
              break
            fi
            sleep 2
          done

          kill "$(cat dev.pid)" 2>/dev/null || true

          if [ -z "$ok" ]; then
            echo "::error::${{ inputs.service }}'s /openapi.json never came up under wrangler dev"
            cat wrangler-dev.log
            exit 1
          fi

      # One version line, three dist-tags: `dev` is a rolling prerelease
      # (every run gets a fresh, always-increasing build number, no need to
      # look anything up); `staging`/`production` are real semver bumps off
      # whatever that channel last published, so consumers pinned to
      # `@staging`/`latest` see an ordinary version history.
      - name: Resolve version + dist-tag
        id: version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          case "${{ inputs.environment }}" in
            dev)
              tag=dev
              version="0.0.0-dev.${{ github.run_number }}"
              ;;
            staging)
              tag=staging
              current=$(npm view "${{ inputs.package_name }}" dist-tags.staging 2>/dev/null || true)
              version=$(node -e "
                const c = '$current'.trim();
                const [maj, min, pat] = (c || '1.0.0').split('.').map(Number);
                console.log(\`\${maj}.\${min}.\${(pat || 0) + (c ? 1 : 0)}\`);
              ")
              ;;
            production)
              tag=latest
              current=$(npm view "${{ inputs.package_name }}" dist-tags.latest 2>/dev/null || true)
              version=$(node -e "
                const c = '$current'.trim();
                const [maj, min, pat] = (c || '1.0.0').split('.').map(Number);
                console.log(\`\${maj}.\${min}.\${(pat || 0) + (c ? 1 : 0)}\`);
              ")
              ;;
            *)
              echo "::error::unknown environment '${{ inputs.environment }}'"; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing ${{ inputs.package_name }}@$version to dist-tag '$tag'"

      - name: Generate Angular client from OpenAPI spec
        run: |
          npx --yes @openapitools/openapi-generator-cli@latest generate \
            -i spec.json \
            -g typescript-angular \
            -o "clients/${{ inputs.service }}" \
            --additional-properties="npmName=${{ inputs.package_name }},npmVersion=${{ steps.version.outputs.version }},ngVersion=${{ env.NG_VERSION }},providedInRoot=true,stringEnums=true,supportsES6=true"

      - name: Build (ng-packagr)
        working-directory: clients/${{ inputs.service }}
        run: |
          npm install
          npm run build

      - name: Publish to GitHub Packages
        working-directory: clients/${{ inputs.service }}/dist
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN || secrets.GITHUB_TOKEN }}
        run: npm publish --tag ${{ steps.version.outputs.tag }}
