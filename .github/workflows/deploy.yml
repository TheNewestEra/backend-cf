name: Deploy Workers

# Independently-deployable Workers live under apps/*, sharing packages/shared.
# The registry of known services (and which of them share the D1 database)
# lives in .github/services.json — that file, not this one, is what needs
# editing to add a new service. Each service deploys via the reusable
# ./deploy-service.yml workflow, fanned out as a matrix.
#
# Two ways to trigger:
#   - push to main: always targets production, deploying every service.
#   - workflow_dispatch: pick the target environment (dev/staging/
#     production) and which services to touch — a comma-separated list
#     (e.g. "accounts,browse") or "all" (the default).
#
# Provisioning happens once, up front, before any service deploys — today
# that's just applying D1 migrations (one shared physical database per
# environment, applied via apps/accounts's wrangler.jsonc since every
# D1-bound service in that environment points at the same database), gated
# on at least one D1-bound service (see .github/services.json's
# d1_services) being part of this run. Any future non-deploy-time
# provisioning (e.g. one-off backfills) belongs in that same job — resource
# creation itself (KV/R2/D1/queues/Durable Objects) is otherwise handled by
# Wrangler's automatic provisioning during `wrangler deploy`, no extra step
# needed.
#
# All selected services then deploy in parallel, in one matrix job. Some of
# these Workers hold `services` bindings to each other (e.g. apps/leaderboard
# binds ACCOUNTS — see each app's wrangler.jsonc for its own bindings), and
# Cloudflare requires a binding's target Worker to already exist, but only
# the *first* time that target Worker is created — redeploying an existing
# Worker is an atomic version swap that never un-deploys it. So this is only
# safe for an environment that has already had every service deployed at
# least once (true today for dev/staging/production). Bootstrapping a
# brand-new environment for the first time needs one manual sequential pass
# via workflow_dispatch's `services` input, in dependency order, before
# switching that environment over to normal fully-parallel runs:
#   1. accounts, browse
#   2. leaderboard            (binds ACCOUNTS)
#   3. guess, puzzle          (bind ACCOUNTS, BROWSE, LEADERBOARD)
#   4. friends                (binds ACCOUNTS, PUZZLE)
#
# Each deploying service also gets its Angular client package (re)published
# via the reusable ./publish-client.yml workflow, in its own matrix job that
# runs in parallel with — not after — the deploy matrix (its OpenAPI spec is
# pulled from a local `wrangler dev` boot, not the live deployment, so
# there's nothing to wait on). That workflow only actually publishes when
# the fetched spec differs from the last published one for that service.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options: [dev, staging, production]
        default: dev
      services:
        description: "Comma-separated service names (see .github/services.json), or 'all'"
        type: string
        default: all

concurrency:
  group: deploy-${{ github.ref }}-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspaces --if-present

  # Collapses the two trigger types into one consistent set of outputs, read
  # from .github/services.json: which environment, which services are going
  # out this run, and whether any of them needs D1 provisioned first.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      services: ${{ steps.resolve.outputs.services }}
      provision_needed: ${{ steps.resolve.outputs.provision_needed }}
    env:
      EVENT_NAME: ${{ github.event_name }}
      IN_ENVIRONMENT: ${{ inputs.environment }}
      IN_SERVICES: ${{ inputs.services }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: resolve
        run: |
          node <<'EOF' >> "$GITHUB_OUTPUT"
          const fs = require("fs");
          const registry = JSON.parse(fs.readFileSync(".github/services.json", "utf8"));
          const allServices = registry.services;
          const d1Services = new Set(registry.d1_services ?? []);

          const isPush = process.env.EVENT_NAME !== "workflow_dispatch";
          const environment = isPush ? "production" : (process.env.IN_ENVIRONMENT || "dev");
          const requestedRaw = isPush ? "all" : (process.env.IN_SERVICES || "all");

          const requested = requestedRaw.trim().toLowerCase() === "all"
            ? allServices
            : requestedRaw.split(",").map((s) => s.trim()).filter(Boolean);

          const unknown = requested.filter((s) => !allServices.includes(s));
          if (unknown.length) {
            throw new Error(`Unknown service(s): ${unknown.join(", ")}. Known services: ${allServices.join(", ")}`);
          }

          const provisionNeeded = requested.some((s) => d1Services.has(s));

          console.log(`environment=${environment}`);
          console.log(`services=${JSON.stringify(requested)}`);
          console.log(`provision_needed=${provisionNeeded}`);
          EOF

  # Idempotent — safe to run whenever a D1-bound service is going out,
  # rather than trying to path-filter it correctly. Applied via
  # apps/accounts's wrangler.jsonc, which points migrations_dir at the
  # repo-root migrations/ folder; every D1-bound service in a given
  # environment points at that same physical database. (Some of that
  # folder's SQL originates from an app's own Drizzle schema — see
  # ./drizzle-check.yml and apps/friends/src/db/README.md — but that's a
  # hand-copy step upstream of here; this job itself doesn't know or care
  # where the SQL came from.)
  provision:
    needs: [typecheck, resolve]
    if: needs.resolve.outputs.provision_needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - id: target
        run: |
          case "${{ needs.resolve.outputs.environment }}" in
            staging)
              echo "db=game-worker-catalog-staging" >> "$GITHUB_OUTPUT"
              echo "envflag=--env staging" >> "$GITHUB_OUTPUT"
              ;;
            production)
              echo "db=game-worker-catalog-prod" >> "$GITHUB_OUTPUT"
              echo "envflag=--env production" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "db=game-worker-catalog" >> "$GITHUB_OUTPUT"
              echo 'envflag=--env=""' >> "$GITHUB_OUTPUT"
              ;;
          esac
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/accounts
          command: d1 migrations apply ${{ steps.target.outputs.db }} --remote ${{ steps.target.outputs.envflag }}

  # Fans out over every service selected this run — see the header comment
  # above for why "all in parallel" is safe here. working_directory and the
  # published client's package_name are both derived by convention
  # (apps/<service>, @thenewestera/<service>-ng) rather than looked up, so
  # a new entry in .github/services.json is the only change a new service
  # needs.
  deploy:
    needs: [resolve, typecheck, provision]
    if: |
      always() &&
      needs.resolve.outputs.services != '[]' &&
      needs.typecheck.result == 'success' &&
      (needs.provision.result == 'success' || needs.provision.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.resolve.outputs.services) }}
    uses: ./.github/workflows/deploy-service.yml
    with:
      service: ${{ matrix.service }}
      working_directory: apps/${{ matrix.service }}
      environment: ${{ needs.resolve.outputs.environment }}
    secrets: inherit

  # Runs independently of (and in parallel with) the deploy matrix above —
  # see the header comment. Only actually publishes a new npm version when
  # publish-client.yml's own spec-diff check finds the OpenAPI doc changed.
  publish-clients:
    needs: [resolve, typecheck]
    if: needs.resolve.outputs.services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.resolve.outputs.services) }}
    uses: ./.github/workflows/publish-client.yml
    with:
      service: ${{ matrix.service }}
      working_directory: apps/${{ matrix.service }}
      package_name: "@thenewestera/${{ matrix.service }}-ng"
      environment: ${{ needs.resolve.outputs.environment }}
    secrets: inherit
